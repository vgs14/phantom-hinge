# Configuration file for dnsmasq.
#
# Some of this was sourced from:
# http://www.heath-bar.com/projects/blog/?p=326
# and http://www.thekelleys.org.uk/dnsmasq/docs/dnsmasq.conf.example
# and https://forum.ipxe.org/showthread.php?tid=6077
# and http://www.thekelleys.org.uk/dnsmasq/docs/dnsmasq.conf.example

# All of the UEFI stuff was sourced from
# https://eatpeppershothot.blogspot.com/2016/02/uefi-and-legacy-bios-pxe-netboot.html

# Debug logging, to stderr so it shows up in `docker logs ph_dnsmasq`
# (size-capped in docker-compose.yml) rather than a file inside the
# container that nothing rotates.
log-facility=-
log-queries
log-dhcp

# Listen on all interfaces
bind-interfaces

# We are the DHCP server
dhcp-authoritative

# The DHCP range, DNS server option and the boot.lan -> nginx address all
# depend on the network settings, so they're passed on the command line
# from srv/.env - see "command:" in docker-compose.yml.

# Enable TFTP support
enable-tftp
tftp-root=/tftp

# Misc DNS options
domain=kiosk.local
no-resolv

# --- Architecture detection ---
# Option 93 (client-arch) tells us BIOS vs UEFI vs UEFI-with-HTTP, etc.
dhcp-match=set:bios,option:client-arch,0
dhcp-match=set:efi64,option:client-arch,6
dhcp-match=set:efi64,option:client-arch,7
dhcp-match=set:efi64,option:client-arch,9

# --- Detect clients that are ALREADY running iPXE ---
# iPXE sets its own DHCP user-class string "iPXE" so we don't loop forever handing it the bootloader again.
dhcp-userclass=set:ipxe,iPXE

# iPXE in UEFI mode sets DHCP option 175
#dhcp-match=set:ipxe,175 # iPXE sends a 175 option.

# --- Stage 1: hand out the correct bootloader to non-iPXE clients ---
# The files are here:
# https://boot.ipxe.org/x86_64-efi/ipxe.efi
# https://boot.ipxe.org/x86_64-pcbios/undionly.kpxe
dhcp-boot=tag:bios,tag:!ipxe,boot/undionly.kpxe
dhcp-boot=tag:efi64,tag:!ipxe,boot/ipxe.efi

# --- Stage 2: once iPXE is running, chainload to your boot script ---
# This can be a local file or (better) an HTTP URL, since iPXE supports HTTP.
dhcp-boot=/autoexec.ipxe
