# Run as a less privileged user for security reasons.
user nginx;

# How many worker threads to run;
# "auto" sets it to the number of CPU cores available in the system, and
# offers the best performance. Don't set it higher than the number of CPU
# cores if changing this parameter.

# The maximum number of connections for Nginx is calculated by:
# max_clients = worker_processes * worker_connections
worker_processes auto;

# Maximum open file descriptors per process;
# should be > worker_connections.
worker_rlimit_nofile 8192;

# Process needs to run in foreground within container
daemon off;

pid        /var/run/nginx.pid;

# Logs to the container's stdout/stderr, so they show up in `docker logs
# ph_nginx` (size-capped in docker-compose.yml). Without this nginx writes
# to files inside the container that nothing rotates - every kiosk boot
# fetches a few hundred packages, so the access log grows steadily.
error_log /dev/stderr;

events {
        worker_connections 768;
        # multi_accept on;
}


http {

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_names_hash_bucket_size 64;

    gzip on;
    index index.htm;

    access_log /dev/stdout;

    server {
        # Clients only ever reach this by IP (see autoexec.ipxe), so a
        # catch-all default server is all that's needed.
        listen 80 default_server;
        server_name _;
        
        # Web root
        root /wwwroot;
    }
}
