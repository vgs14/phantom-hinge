# Disable the magic SysRq key. With it enabled, anyone at the keyboard can
# Alt+SysRq their way to killing every process (including Sway, leaving
# the bare console), remounting, or rebooting - none of which a kiosk user
# should be able to do. Applied by the sysctl service in the boot runlevel;
# autoexec.ipxe also sets it on the kernel command line, which covers the
# initramfs before this file is ever read.
kernel.sysrq = 0
